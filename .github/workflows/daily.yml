name: markets-robot
on:
  schedule:
    - cron: "15 3 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: news or signals
        default: signals
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run robot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 3 * * 1-5" ]; then MODE=news; else MODE=signals; fi
          fi
          python engine.py "$MODE"
      - name: Save dashboard data
        run: |
          git config user.name "markets-robot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "robot: update data" || echo "no changes"
          git push
